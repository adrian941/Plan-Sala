<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meniul — Ema &amp; Adi</title>
<meta name="color-scheme" content="light dark">

<!-- PWA: aplicație instalabilă. Manifestul și sw.js stau în rădăcină
     (un service worker controlează doar folderul lui și ce e sub el). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="Meniul">
<!-- Bara de sus a telefonului ia exact culoarea fundalului aplicației, ca să nu mai existe
     „bărbia” neagră la pornire. Aceleași valori sunt și în manifest (folosit înainte să se
     încarce pagina) și în CSS-ul critic de mai jos (folosit din prima imagine desenată). -->
<meta name="theme-color" content="#F4F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meniul">
<!-- „black-translucent”: pagina intră sub bara de sus, iar CSS-ul o ferește cu safe-area -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="_site/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="_site/icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="_site/icons/icon.svg">
<link rel="apple-touch-icon" href="_site/icons/apple-touch-icon.png">

<!-- CSS critic, în pagină: fundalul e corect din PRIMA imagine desenată, înainte să apuce
     browserul să ceară style.css. Fără el, telefonul desenează întâi negru („bărbia”) și
     abia apoi culoarea aplicației — de aceea sărea culoarea la pornire vs. la revenire. -->
<style>
  html { background: #F4F3F8; }
  body { margin: 0; background: #F4F3F8; color: #201C36; }
  @media (prefers-color-scheme: dark) {
    html { background: #14121F; }
    body { background: #14121F; color: #F1EFF8; }
  }
  html, body { overscroll-behavior: none; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<!-- CSS-ul și JS-urile se încarcă mereu proaspete: parametru unic la fiecare deschidere, ca browserul să nu țină versiuni vechi -->
<script>document.write('<link rel="stylesheet" href="_site/style.css?t=' + Date.now() + '">');</script>
<noscript><link rel="stylesheet" href="_site/style.css"></noscript>
</head>
<body class="v-ema pg-meniu">

<header class="top">
  <!-- Zona de sus, pe telefon: DOUĂ rânduri, toate butoanele la aceeași înălțime.
       (1) paginile + butonul de opțiuni · (2) al cui meniu + ce săptămână.
       Macro / Ingrediente / PDF sunt folosite rar, deci stau într-un panou care se
       deschide din butonul de opțiuni — nu mai mănâncă un rând întreg pe verticală.
       Pe ecran mare apar titlul și, direct în rând, aceleași butoane de opțiuni. -->
  <div class="rand">
    <div class="title">
      <h1>Meniul</h1>
      <p class="sub">2 săptămâni, aceleași rețete, porții diferite</p>
    </div>

    <nav class="seg pages" id="pages" aria-label="Pagini">
      <button type="button" data-page="meniu" class="on" aria-current="page">Meniu</button>
      <button type="button" data-page="retete">Rețete</button>
      <button type="button" data-page="alimente">Alimente</button>
    </nav>

    <div class="opts only-meniu" id="opts">
      <button class="ico" id="opts-btn" type="button" aria-expanded="false" aria-controls="opts-panel"
              aria-label="Opțiuni de afișare" title="Opțiuni de afișare">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 8h9M17 8h4M3 16h5M13 16h8"/>
          <circle cx="14.5" cy="8" r="2.2"/><circle cx="10.5" cy="16" r="2.2"/>
        </svg>
      </button>
      <div class="opts-panel" id="opts-panel">
        <button class="ingbtn" id="toggle-macro" type="button" aria-pressed="false">Macro</button>
        <button class="ingbtn" id="toggle-ing" type="button" aria-pressed="false">Ingrediente</button>
        <button class="ingbtn pdf" id="pdf" type="button" title="Salvează ca PDF / printează">PDF</button>
        <!-- apare doar când browserul chiar poate instala aplicația -->
        <button class="ingbtn install" id="install" type="button" hidden>Instalează aplicația</button>
      </div>
    </div>
  </div>

  <div class="rand r2 only-meniu">
    <fieldset class="seg who" aria-label="Al cui meniu">
      <i class="thumb" aria-hidden="true"></i>
      <label><input type="radio" name="who" value="ema" checked><span>Ema</span></label>
      <label><input type="radio" name="who" value="comun"><span>Amândoi</span></label>
      <label><input type="radio" name="who" value="adi"><span>Adi</span></label>
    </fieldset>

    <fieldset class="seg week" aria-label="Săptămâna">
      <label><input type="radio" name="week" value="0" checked><span data-short="S1">Săpt. 1</span></label>
      <label><input type="radio" name="week" value="1"><span data-short="S2">Săpt. 2</span></label>
    </fieldset>
  </div>
</header>

<nav class="chips" id="chips" aria-label="Zilele săptămânii"></nav>

<main>
  <div class="days" id="days" aria-live="polite">
    <p class="loading">Se încarcă meniul…</p>
  </div>
  <div class="pane" id="pane-retete" hidden></div>
  <div class="pane" id="pane-alimente" hidden></div>
</main>

<div id="print" hidden aria-hidden="true"></div>

<script>document.write('<script src="_site/data.js?t=' + Date.now() + '"><\/script><script src="_site/app.js?t=' + Date.now() + '"><\/script>');</script>

<script>
/* PWA: pornim service worker-ul (doar prin http/https — din fișier nu are cum) și
   arătăm butonul „Instalează” doar dacă browserul chiar oferă instalarea. */
(function () {
  "use strict";
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
  var btn = document.getElementById("install"), invitatie = null;
  addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); invitatie = e; btn.hidden = false;
  });
  btn.addEventListener("click", function () {
    if (!invitatie) return;
    invitatie.prompt();
    invitatie.userChoice.finally(function () { invitatie = null; btn.hidden = true; });
  });
  addEventListener("appinstalled", function () { invitatie = null; btn.hidden = true; });
})();
</script>
</body>
</html>
